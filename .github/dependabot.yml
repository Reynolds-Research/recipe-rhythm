# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    groups:
      # react and react-dom must always be the exact same version (React
      # refuses to load otherwise). 7cebd16 bumped react alone and broke 27
      # test files on main; grouping makes Dependabot bump them in one PR.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # Everything else that's minor or patch arrives as ONE weekly PR. Separate
      # PRs all edit package-lock.json, so merging any one of them put the rest
      # into conflict (2026-10-30: 4 of 9 open Dependabot PRs went CONFLICTING
      # after #153/#154 merged). Majors stay separate so a breaking change can
      # be reviewed and declined on its own.
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
      # Same idea for security updates (qs, undici, brace-expansion, …).
      security:
        applies-to: security-updates
        patterns:
          - "*"
